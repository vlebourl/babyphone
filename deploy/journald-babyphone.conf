# Plafonne les journaux systemd sur la microSD du Pi (ADR-0005).
# Déployé vers /etc/systemd/journald.conf.d/ par deploy/deploy.sh.
#
# Sans plafond explicite, journald s'autorise 10 % du système de fichiers,
# soit ~2,9 Go sur la carte de 29 Go. Le babyphone n'a pas besoin de plus
# de quelques jours d'historique, et l'espace disque est la ressource
# critique de cette machine.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=1week
