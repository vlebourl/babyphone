# Chien de garde matériel du Raspberry Pi (ADR-0009).
# Déployé vers /etc/systemd/system.conf.d/ par deploy/deploy.sh.
#
# Le BCM2835 expose un chien de garde matériel que rien n'utilisait. Si le
# noyau se fige — ce qui arrive sur une machine en sous-tension chronique —
# aucun logiciel ne peut plus rien signaler ni redémarrer quoi que ce soit :
# la chambre cesse d'être surveillée sans que rien ne l'indique. Le matériel,
# lui, redémarre la carte tout seul.
#
# 15 s : bien au-dessus de toute pause normale (le pire blocage de la boucle
# d'écoute est ~19 s côté émission, mais il ne fige pas le noyau), assez court
# pour que la surveillance reprenne vite.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
